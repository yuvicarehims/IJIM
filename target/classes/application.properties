spring.application.name=Ijim
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ijim?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mydb
# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# File upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# Upload directory
file.upload-dir=kayauploads/

# DISABLE ALL STATIC RESOURCE HANDLING
spring.web.resources.add-mappings=false
spring.mvc.static-path-pattern=/nonexistent/**

# DEBUG SPRING SECURITY

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.ayur=DEBUG

# See all HTTP requests
logging.level.org.apache.catalina=DEBUG
logging.level.org.springframework.web.filter=DEBUG

# COMPLETELY DISABLE SPRING SECURITY
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JSP debugging
logging.level.org.apache.jasper=DEBUG

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.org.springframework.web.servlet=DEBUG

# Debug
logging.level.com.ayur.controller=DEBUG

# Disable security temporarily for testing
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Server Port
server.port=8090

